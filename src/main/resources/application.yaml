spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: xxx
            client-secret: xxx
            redirect-uri: http://localhost:8082/auth/oauth2/callback
            scope: openid,email,profile

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}

google:
  oauth:
    client-id: xxx
    client-secret: xxx
    redirect-uri: http://localhost:8082/auth/oauth2/callback