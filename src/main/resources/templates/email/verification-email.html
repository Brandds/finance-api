<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <style>

        body{
            background:#f5f5f5;
            font-family:Arial, Helvetica, sans-serif;
            margin:0;
            padding:40px;
        }

        .container{
            max-width:600px;
            margin:auto;
            background:white;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 5px 20px rgba(0,0,0,.1);
        }

        .header{
            background:#2563eb;
            color:white;
            padding:30px;
            text-align:center;
        }

        .content{
            padding:40px;
        }

        .button{

            display:inline-block;
            background:#2563eb;
            color:white !important;
            padding:15px 25px;
            text-decoration:none;
            border-radius:6px;
            font-weight:bold;
        }

        .footer{
            background:#f2f2f2;
            padding:20px;
            text-align:center;
            font-size:13px;
            color:#777;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h2>Finance App</h2>

    </div>

    <div class="content">

        <h3>Olá, <span th:text="${name}"></span>!</h3>

        <p>

            Obrigado por criar sua conta.

        </p>

        <p>

            Para concluir seu cadastro clique no botão abaixo.

        </p>

        <p style="text-align:center">

            <a
                    class="button"
                    th:href="${verificationUrl}">
                Confirmar Cadastro
            </a>

        </p>

        <p>

            Este link expira em
            <strong th:text="${expiration}"></strong>.

        </p>

        <p>

            Caso você não tenha solicitado este cadastro,
            ignore este e-mail.

        </p>

    </div>

    <div class="footer">

        © 2026 Finance App

    </div>

</div>

</body>

</html>
